name: Production update

on:
  schedule:
    - cron: "15 9,21 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      ai_provider:
        description: Primary AI provider profile for this run
        required: true
        default: openrouter
        type: choice
        options:
          - openrouter
          - deepseek
      force_held:
        description: Explicitly retry held AI work that may already have been billed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-update-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  update:
    name: Crawl, enrich, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_PROVIDER: ${{ inputs.ai_provider || vars.AI_PROVIDER || 'openrouter' }}

    steps:
      - name: Check out the production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the locked site dependencies
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test fixed programs before any model call
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          npm --prefix site run lint
          npm --prefix site run typecheck
          npm --prefix site test

      - name: Restore the public cloud state
        run: |
          ./aaron-reader crawl-import crawler/latest.json --seed --json
          ./aaron-reader ai-cache-import cloud/ai-cache.json --json

      - name: Crawl all publishers with fixed code
        run: |
          ./aaron-reader sync
          ./aaron-reader status --strict --json

      - name: Generate only missing or changed language artifacts
        id: ai
        continue-on-error: true
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ (inputs.ai_provider || vars.AI_PROVIDER || 'openrouter') == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          FORCE_HELD: ${{ inputs.force_held || 'false' }}
          AUTO_RETRY_PAID_FAILURES: ${{ github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          case "$AI_PROVIDER" in
            deepseek|openrouter)
              ;;
            *)
              echo "Unsupported AI provider profile: $AI_PROVIDER" >&2
              exit 2
              ;;
          esac
          arguments=(ai cloud-run --provider "$AI_PROVIDER" --yes --json --limit 50)
          if [[ "$AI_PROVIDER" == "openrouter" ]]; then
            arguments+=(--fallback-provider deepseek)
          else
            arguments+=(--fallback-provider none)
          fi
          if [[ "$AUTO_RETRY_PAID_FAILURES" == "true" ]]; then
            arguments+=(--retry-paid-failures)
          fi
          if [[ "$FORCE_HELD" == "true" ]]; then
            arguments+=(--force-held)
          fi
          ./aaron-reader "${arguments[@]}" | tee data/cloud-ai-run.json

      - name: Export and independently validate both public handoffs
        run: |
          ./aaron-reader crawl-export crawler/latest.json --json
          ./aaron-reader ai-cache-export cloud/ai-cache.json --json
          test ! -e data/cloud-validation.sqlite3
          ./aaron-reader \
            --database data/cloud-validation.sqlite3 \
            crawl-import crawler/latest.json --seed --json
          ./aaron-reader \
            --database data/cloud-validation.sqlite3 \
            ai-cache-import cloud/ai-cache.json --json
          ./aaron-reader \
            --database data/cloud-validation.sqlite3 \
            status --strict --json

      - name: Build and commit the exact public state
        shell: bash
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/prepare_cloudflare_release.py --skip-sync \
            --database data/cloud-validation.sqlite3 \
            | tee data/cloud-release.json

      - name: Push only the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$EXPECTED_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Refusing invalid GitHub repository identity" >&2
            exit 1
          fi
          remote="$(git remote get-url origin)"
          expected="https://github.com/${EXPECTED_REPOSITORY}"
          if [[ "$remote" != "$expected" && "$remote" != "${expected}.git" ]]; then
            echo "Refusing unexpected Git origin: $remote" >&2
            exit 1
          fi
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin HEAD:main

      - name: Verify Cloudflare published the exact snapshot
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://aaron-reader.aaron-he-zhu.workers.dev/' }}
          DEPLOYMENT_CHECK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urljoin, urlsplit
          from urllib.request import Request, urlopen

          base = os.environ["PUBLIC_SITE_URL"].strip()
          parts = urlsplit(base)
          if (
              parts.scheme != "https"
              or not parts.hostname
              or parts.username
              or parts.password
              or parts.query
              or parts.fragment
          ):
              raise SystemExit("PUBLIC_SITE_URL must be a credential-free HTTPS origin")
          expected = Path("site/public/reader/latest.json").read_bytes()
          if not expected or len(expected) > 25 * 1024 * 1024:
              raise SystemExit("expected public snapshot is outside the safe size range")
          expected_hash = hashlib.sha256(expected).hexdigest()
          endpoint = urljoin(base.rstrip("/") + "/", "reader/latest.json")
          check_id = quote(os.environ["DEPLOYMENT_CHECK_ID"], safe="-")

          for attempt in range(36):
              request = Request(
                  "%s?deployment-check=%s-%d" % (endpoint, check_id, attempt),
                  headers={"Accept": "application/json", "User-Agent": "AaronReaderDeploymentCheck/1.0"},
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      body = response.read(len(expected) + 1)
                  if len(body) == len(expected) and hmac.compare_digest(body, expected):
                      print("Cloudflare snapshot verified: sha256:%s" % expected_hash)
                      break
              except (HTTPError, URLError, TimeoutError, OSError):
                  pass
              if attempt == 35:
                  raise SystemExit(
                      "Cloudflare did not publish the expected snapshot within six minutes"
                  )
              time.sleep(10)
          PY

      - name: Write a redacted run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [
              "# Aaron Reader production update",
              "",
              "Workflow status before final alert: **%s**" % os.environ["JOB_STATUS"],
              "",
              "AI step outcome: **%s**" % (os.environ.get("AI_OUTCOME") or "not-run"),
          ]
          for title, filename in (
              ("AI usage", "data/cloud-ai-run.json"),
              ("Publication", "data/cloud-release.json"),
          ):
              path = Path(filename)
              if not path.is_file():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              lines.extend(["", "## %s" % title, "", "```json", json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), "```"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Report incomplete AI cycle after successful publish
        if: steps.ai.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          # Layer 2 防呆: If we reach this step, crawl/validate/push/Cloudflare verify
          # have all succeeded.  A successful publish must NEVER be a red job.
          # Incomplete AI, leftover holds, and even new holds this cycle emit warnings
          # but do NOT hard-fail the job.

          ai_result_path = Path("data/cloud-ai-run.json")
          if not ai_result_path.is_file():
              print("::warning::AI result file not found; publish succeeded but AI status unknown")
              sys.exit(0)

          try:
              result = json.loads(ai_result_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as e:
              print("::warning::Failed to parse AI result: %s; publish succeeded but AI status unknown" % e)
              sys.exit(0)

          failures = result.get("failures", [])
          new_holds = int(result.get("generation_holds_new_this_cycle", 0))
          preexisting_skipped = int(result.get("generation_holds_preexisting_skipped", 0))
          total_skipped = int(result.get("generation_holds_skipped", 0))
          fallback_events = result.get("fallback_events", [])
          untranslated = int(result.get("untranslated_count", 0))

          # Layer 3: Make stuck work visible via warnings
          if failures:
              print("::warning::AI enrichment had %d failure(s) this cycle" % len(failures))
              for i, failure in enumerate(failures[:5]):
                  error = str(failure.get("error", "unknown"))[:100]
                  print("  [%d] %s: %s" % (i + 1, failure.get("kind", "unknown"), error))
              if len(failures) > 5:
                  print("  ... and %d more" % (len(failures) - 5))

          if new_holds > 0:
              print("::warning::AI created %d new hold(s) this cycle (awaiting manual review or retry)" % new_holds)

          if preexisting_skipped > 0:
              print("::warning::AI skipped %d pre-existing hold(s) (require manual attention)" % preexisting_skipped)

          if fallback_events:
              print("::notice::AI fallback activated %d time(s) (OpenRouter -> DeepSeek)" % len(fallback_events))

          if untranslated > 0:
              print("::warning::%d article(s) remain untranslated" % untranslated)

          # Summarize but ALWAYS succeed - publish was successful
          total_issues = len(failures) + new_holds + preexisting_skipped
          if total_issues > 0:
              print("")
              print("Cloudflare publish succeeded. AI backlog (%d issue(s)) requires attention but is not blocking." % total_issues)
          else:
              print("AI step returned non-zero but no specific issues found; publish succeeded.")

          sys.exit(0)
          PY
