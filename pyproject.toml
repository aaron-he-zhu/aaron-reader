[project]
name = "aaron-reader"
version = "1.1.0"
description = "Deterministic, local-first blog subscriptions with zero LLM calls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aaron Zhu" }]
dependencies = []

[project.urls]
Homepage = "https://aaron-reader.aaron-he-zhu.workers.dev/"
Repository = "https://github.com/aaron-he-zhu/aaron-reader"
Issues = "https://github.com/aaron-he-zhu/aaron-reader/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
